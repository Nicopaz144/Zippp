name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Compilar (sin firmar)
        run: |
          xcodebuild \
            -project ZipStream.xcodeproj \
            -scheme ZipStream \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ZipStream.app Payload/
          zip -r ZipStream.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ZipStream-ipa
          path: ZipStream.ipa
