name: ZipStream
options:
  bundleIdPrefix: com.zipstream
  deploymentTarget:
    iOS: "16.0"
targets:
  ZipStream:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: ZipStream
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - sdk: libz.tbd
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        PRODUCT_BUNDLE_IDENTIFIER: com.zipstream.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
